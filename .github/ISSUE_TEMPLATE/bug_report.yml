name: Bug Report
description: File a bug report or report unexpected behavior in HourForge
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much technical detail as possible.
        **Important:** Never paste sensitive Steam Web API keys, Steam passwords, or personal credentials in bug reports.

  - type: dropdown
    id: version
    attributes:
      label: HourForge Version
      description: What version of HourForge are you running?
      options:
        - "0.1.2"
        - "0.1.1"
        - "0.1.0-alpha"
        - "Other / Built from Source"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Windows OS Version
      description: Which Windows version is installed?
      options:
        - "Windows 11 (23H2 / 24H2)"
        - "Windows 11 (21H2 / 22H2)"
        - "Windows 10 (21H2 / 22H2)"
        - "Windows 10 (Legacy)"
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: Operating Mode
      description: Which operating mode was active when the issue occurred?
      options:
        - "Dedicated (Quota)"
        - "Catch-Up (Goal)"
        - "Single Game (Open)"
        - "Multi-Game (Alternating)"
        - "N/A (App startup / UI only)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
      placeholder: "e.g. When starting a run with Once Human, ..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Diagnostics
      description: Paste any relevant lines from the Logs Viewer (Settings -> Export Diagnostics or Logs Viewer). Please redact any personal Steam IDs!
      render: shell
